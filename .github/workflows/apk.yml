name: Build APK

# 每次推 main / 提 PR 都会跑：先静态检查 + 单元测试，再编译 H5 并打出可安装的 APK。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支上的旧任务自动取消，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 静态检查（pages.json / 路由 / 模板 / 脚本）
        run: npm run lint

      - name: 单元测试
        run: npm test

  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/uni-cli/package-lock.json

      # GitHub 的 ubuntu runner 自带 Android SDK（build-tools + platforms），
      # tools/build-apk.js 会自己从 ANDROID_HOME 里探测，不用额外装
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 打印 Android SDK 情况（排查用）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true
          echo "--- platforms ---";   ls "$ANDROID_HOME/platforms"  || true

      - name: 编译 H5（首次会装 uni-app CLI 依赖）
        run: node tools/build-h5.js --install

      - name: 打包 APK
        env:
          # 想用正式签名就在仓库 Secrets 里配这几项；
          # 不配的话 build-apk.js 会现场生成一个 demo 证书（仅供安装测试）
          FAKEKEEP_KS_PASS: ${{ secrets.FAKEKEEP_KS_PASS }}
          FAKEKEEP_KEY_ALIAS: ${{ secrets.FAKEKEEP_KEY_ALIAS }}
          FAKEKEEP_KEY_PASS: ${{ secrets.FAKEKEEP_KEY_PASS }}
          FAKEKEEP_KEYSTORE_BASE64: ${{ secrets.FAKEKEEP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FAKEKEEP_KEYSTORE_BASE64" ]; then
            echo "使用 Secrets 里的签名证书"
            printf '%s' "$FAKEKEEP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            node tools/build-apk.js --keystore "$RUNNER_TEMP/release.jks"
          else
            echo "未配置签名证书，使用 demo 证书"
            node tools/build-apk.js
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeKeep-APK
          path: unpackage/release/apk/*.apk
          if-no-files-found: error

      - name: 上传 H5 产物（可直接部署成网页版）
        uses: actions/upload-artifact@v4
        with:
          name: FakeKeep-H5
          path: unpackage/dist/build/h5
          if-no-files-found: error
